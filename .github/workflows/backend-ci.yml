name: Backend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: uio_test
          MYSQL_USER: uio
          MYSQL_PASSWORD: uio_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: backend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        
    - name: Lint with Ruff
      run: |
        ruff check .
        
    - name: Type checking with mypy
      run: |
        mypy app/

    - name: Test with pytest (in-memory SQLite)
      run: |
        pytest

    - name: Test with pytest (MySQL 8)
      env:
        TEST_DATABASE_URL: mysql+pymysql://uio:uio_password@127.0.0.1:3306/uio_test
      run: |
        pytest
