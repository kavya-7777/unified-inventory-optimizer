services:
  postgres:
    image: postgres:15-alpine
    container_name: meio-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meio_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meio_password}
      POSTGRES_DB: ${POSTGRES_DB:-meio_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meio_user} -d ${POSTGRES_DB:-meio_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meio-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - DEBUG=true
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-meio_user}:${POSTGRES_PASSWORD:-meio_password}@postgres:5432/${POSTGRES_DB:-meio_db}
      - CORS_ORIGINS=http://localhost:5173
      - LOG_LEVEL=INFO
      - OPTIMIZATION_TIMEOUT_SECONDS=60
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./database:/database
      - ./scripts:/scripts
      - ./data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meio-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
