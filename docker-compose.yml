services:
  mysql:
    image: mysql:8.0
    container_name: meio-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-uio}
      MYSQL_USER: ${MYSQL_USER:-uio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-uio_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"  # 3307 on the host, so it doesn't clash with a local MySQL
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    container_name: meio-backend
    restart: unless-stopped
    # Local dev: apply migrations, then serve with auto-reload on code changes.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - DEBUG=true
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-uio}:${MYSQL_PASSWORD:-uio_password}@mysql:3306/${MYSQL_DATABASE:-uio}
      - CORS_ORIGINS=http://localhost:5173
      - LOG_LEVEL=INFO
      - OPTIMIZATION_TIMEOUT_SECONDS=60
      - API_KEY=${API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin12345}
      - ADMIN_NAME=${ADMIN_NAME:-Administrator}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./scripts:/scripts
      - ./data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meio-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mysql_data:
